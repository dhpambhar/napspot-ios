# XcodeGen spec. On the Mac:
#   brew install xcodegen
#   xcodegen generate && open NapSpot.xcodeproj
# Re-run `xcodegen generate` after adding or removing files.

name: NapSpot
options:
  bundleIdPrefix: com.example          # replace with your reverse domain before TestFlight
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""               # set your team ID, or pick it in Signing & Capabilities
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"      # iPhone and iPad
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  NapSpot:
    type: application
    platform: iOS
    sources:
      - path: NapSpot
    info:
      path: NapSpot/Info.plist
      properties:
        CFBundleDisplayName: NapSpot
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.NapSpot
        ENABLE_PREVIEWS: true

  NapSpotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NapSpotTests
    dependencies:
      - target: NapSpot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.NapSpotTests
        GENERATE_INFOPLIST_FILE: true

schemes:
  NapSpot:
    build:
      targets:
        NapSpot: all
        NapSpotTests: [test]
    test:
      targets:
        - NapSpotTests
